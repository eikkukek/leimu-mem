[package]
name = "leimu-mem"
version = "0.4.2"
edition = "2024"
description = "Custom allocator collections and utilities."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eikkukek/leimu-mem"
readme = "README.md"
keywords = ["allocator", "arena", "slotmap", "container", "vector"]
categories = ["data-structures", "memory-management", "no-std", "no-std::no-alloc"]


[dependencies]
portable-atomic = { version = "1.15.0", optional = true }

[features]
default = ["std"]
std = ["dep:portable-atomic"]
